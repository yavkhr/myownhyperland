$mainMod = SUPER
$terminal = kitty
$fileManager = $HOME/.local/bin/waybar-file-manager
$menu = fuzzel

monitor = , preferred, auto, auto

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once = env LD_LIBRARY_PATH=/usr/libexec/hyprland/vendor/lib64 hyprpaper
exec-once = waybar
exec-once = /usr/libexec/hyprpolkitagent
exec-once = sh $HOME/.local/bin/lock-hyprland

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
}

binds {
    scroll_event_delay = 250
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, G, exec, chatgpt
bind = $mainMod, V, exec, $HOME/.local/bin/viber
bind = $mainMod, T, exec, $HOME/.local/bin/telegram
bind = $mainMod, B, exec, firefox
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, S, exec, $HOME/.local/bin/take-screenshot
bind = $mainMod, O, exec, $HOME/AppImages/obsidian.appimage
bind = $mainMod, W, killactive
bind = $mainMod, C, killactive
bind = $mainMod, M, exec, sh $HOME/.local/bin/lock-hyprland
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, F12, exec, loginctl terminate-session $XDG_SESSION_ID
bind = $mainMod, S, togglespecialworkspace, magic

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = SUPER, mouse_down, workspace, r-1
bind = SUPER, mouse_up, workspace, r+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = suppress_event maximize, class:.*
windowrule = no_focus on, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrule = float on, class:hyprland-run
windowrule = move 20 monitor_h-120, class:hyprland-run
